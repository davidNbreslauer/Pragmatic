[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thesisgraph"
version = "0.1.0"
description = "Autoresearch state machine for evidence-backed thesis evaluation."
requires-python = ">=3.11"
dependencies = [
    "modal>=1.4,<2",
    "openai>=2,<3",
    "openai-agents>=0.17.4,<0.18",
    "pydantic>=2.7,<3",
    "raindrop-ai>=0.0.50,<0.1",
    "streamlit>=1.36,<2",
]

[project.scripts]
thesisgraph = "thesisgraph.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
