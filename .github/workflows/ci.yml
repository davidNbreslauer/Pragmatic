name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Run demo smoke
        run: python -m pragmatic demo-smoke --fail-on-fail

      - name: Compile Python files
        run: python -m compileall app.py realtime_app.py src tests

      - name: Check eval baseline
        run: python -m pragmatic check-eval-baseline eval_baselines/default_v1.json --fail-on-regression
